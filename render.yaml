# Blueprint for Render: Postgres + API.
# After deploy: create a Static Site for `frontend` with build `npm ci && npm run build`
# and env VITE_API_URL=https://<your-api-service>.onrender.com

databases:
  - name: hotspot-db
    databaseName: hotspot
    user: hotspot

services:
  - type: web
    name: hotspot-api
    runtime: node
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: hotspot-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: PAYMENT_MODE
        value: mock
    autoDeploy: true
